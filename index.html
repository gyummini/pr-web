<!-- 첫 진입 표지(10/10 나1) — 첫 진입(/ · /intro)에서만 아래 #boot-cover를 보인다. 스크립트 · 데이터를 받기 전 첫 프레임부터 뜨게 하려고 HTML에 둔다.
     다른 주소로 바로 들어오면 표지 없이 그 화면이 뜬다. 움직임 줄이기 설정이면 전처럼 표지를 쓰지 않는다 -->
<script>
  (function () {
    var p = location.pathname.replace(/\/+$/, '') || '/';
    var legacy = /^#\/./.test(location.hash);
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if ((p === '/' || p === '/intro') && !legacy && !still) document.documentElement.classList.add('boot-cover');
    // 밤 사무소(10/11 나4 이스터에그) — 한국 시간 저녁 7시부터 새벽 6시 전까지는 사무소 그림을 밤으로. 한국은 일광 절약 시간이 없어 UTC+9 고정
    var kst = new Date(Date.now() + 9 * 3600e3).getUTCHours();
    if (kst >= 19 || kst < 6) document.documentElement.classList.add('night');
  })();
</script>

<!-- 도장 잉크가 번진 가장자리(10/10) — 큰 도장(.stamp)이 filter: url(#ink-rough)로 쓴다. 잡음으로 테두리 · 글자를 1px 남짓 흔든다 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="ink-rough" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
